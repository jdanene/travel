<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#141414">
  <title>Bali · Koh Phangan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- The smoke the splash rolled in covers the first paint (public/assets/smoke.css), so there is no white flash;
       the dark page and the flyer's shape sit under it until the app draws the trip. -->
  <link rel="stylesheet" href="/assets/smoke.css">
  <style>
    html { background: #141414; }
    .boot { max-width: 40rem; margin: 0 auto; padding: 0 1.25rem; }
    .boot-cover { height: 52vh; border-radius: 0 0 1.75rem 1.75rem; background: #2a2a2a; }
    .boot-title { width: 70%; height: 3rem; margin: 2.5rem auto 0; border-radius: .75rem; background: #2a2a2a; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Yellowtail&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"><div class="boot" aria-busy="true"><div class="boot-cover"></div><div class="boot-title"></div></div></div>
  <div class="smoke on" id="smoke" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <!-- The smoke can never stick: it clears after 4 s whatever the app is doing (src/app/lib/smoke.ts). -->
  <script>setTimeout(function () { var s = document.getElementById("smoke"); if (s && !s.classList.contains("out")) { s.classList.add("out"); setTimeout(function () { s.remove(); }, 800); } }, 4000);</script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
