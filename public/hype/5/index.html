<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TRAVEL</title>
<link rel="stylesheet" href="/assets/hype.css?v=14">
<style>
  body { background: #120a1e; }
  .card { position: absolute; border: 5px solid #000; outline: 4px solid #fff; overflow: hidden; box-shadow: 0 16px 30px #000a;
    opacity: 0; animation: drop .5s cubic-bezier(.2, 1.3, .4, 1) both; }
  @keyframes drop { from { opacity: 0; transform: translateY(-60px) rotate(var(--r)) scale(1.2); } to { opacity: 1; transform: rotate(var(--r)); } }
  .center { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; text-align: center; pointer-events: none; }
  .center .title { font-size: clamp(110px, 20vw, 300px); transform: rotate(-8deg); }
</style>
</head>
<body class="grain">
  <div id="board"></div>
  <div class="center"><div><div class="title">TRAVEL</div><div class="dest">Bali · Koh Phangan · Feb 2027<br><span class="ctry">(Indonesia, Thailand)</span></div></div></div>
<script src="/assets/hype.js?v=19"></script>
<script>
  const H = HYPE, board = document.getElementById("board");
  const items = H.mix();
  items.splice(innerWidth < 760 ? 15 : 18, 0, items.pop());   // the WASTED card sits in the bottom-left corner, under later cards
  // Lay the cards on a loose 6 x 4 grid with jitter, so the whole screen is covered.
  const cols = innerWidth < 760 ? 3 : 6, rows = innerWidth < 760 ? 6 : 4;
  items.forEach((it, k) => {
    const c = document.createElement("div");
    c.className = "card";
    const cw = 100 / cols, rh = 100 / rows, col = k % cols, row = Math.floor(k / cols) % rows;
    const jitter = n => (Math.sin(k * 9.7 + n) * 0.5) * 6;
    c.style.cssText = `left:${col * cw - 2 + jitter(1)}vw; top:${row * rh - 3 + jitter(2)}vh; width:${cw + 6}vw; height:${rh + 8}vh;` +
      `--r:${(Math.sin(k * 3.1) * 7).toFixed(1)}deg; animation-delay:${(k * 0.18).toFixed(2)}s; z-index:${k}`;
    c.append(H.el(it, "", { small: true }));
    board.append(c);
  });
  H.bed(); H.sound();
</script>
</body>
</html>
