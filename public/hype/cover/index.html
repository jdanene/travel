<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Trip photos</title>
<link rel="stylesheet" href="/assets/hype.css?v=14">
<style>
  /* Cover mode of option 5, the collage: the trip app shows this page in a frame as its cover
     (web/src/components/FlyerHead.tsx). No title, no button, no sound, no links; nothing takes a tap.
     The page is transparent, so the app's cliff photo shows until the cards land. */
  html, body { background: transparent; pointer-events: none; }
  .card { position: absolute; border: 3px solid #000; outline: 3px solid #fff; overflow: hidden; box-shadow: 0 8px 18px #0009;
    opacity: 0; animation: drop .5s cubic-bezier(.2, 1.3, .4, 1) both; }
  .still .card { animation: none; opacity: 1; transform: rotate(var(--r)); }
  @keyframes drop { from { opacity: 0; transform: translateY(-40px) rotate(var(--r)) scale(1.2); } to { opacity: 1; transform: rotate(var(--r)); } }
  /* A softer cross-fade inside a card than the full-screen boards. */
  .card .layer { transition: opacity .6s ease-in-out; }
  /* Place names stay small on a cover. */
  .place { font-size: clamp(11px, 2.4vw, 15px); left: 6px; bottom: 4px; -webkit-text-stroke-width: 1px; text-shadow: 2px 2px 0 #000; }
  /* A lighter halftone than the full-screen options: the cover is small and the dots would crowd it. */
  .grain::after { background: radial-gradient(#0002 1px, transparent 1.4px) 0 0 / 4px 4px; }
</style>
</head>
<body class="grain">
  <div id="board"></div>
<script src="/assets/hype.js?v=20"></script>
<script>
  // Lays option 5's cards over the whole box: fewer, larger cards on a phone-size box, more when wide. Each card
  // keeps swapping through the whole pool (owner, 24 Nov 2026: "the pics should keep rotating over the set"), on
  // hype.js's board(): random order, each item once per round, none on two cards at once, a photo about 4 s, a clip
  // to its end, two clips at most at once, a soft cross-fade inside the card. Reduced motion: the cards stay still.
  const H = HYPE, board = document.getElementById("board");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let shape = "";
  function lay(animate) {
    const w = innerWidth, h = innerHeight;
    const cols = w < 520 ? 3 : w < 800 ? 4 : 5, rows = h < 300 ? 2 : h < 560 ? 3 : 4;
    if (`${cols}x${rows}` === shape) return;
    shape = `${cols}x${rows}`;
    board.querySelectorAll("video").forEach(v => { v.pause(); v.removeAttribute("src"); v.load(); });
    board.replaceChildren();
    document.body.classList.toggle("still", !animate);
    const count = Math.min(cols * rows + 2, H.photos.length - 1), cards = [];
    for (let k = 0; k < count; k++) {
      const c = document.createElement("div");
      c.className = "card";
      const cw = 100 / cols, rh = 100 / rows, col = k % cols, row = Math.floor(k / cols) % rows;
      const jitter = n => (Math.sin(k * 9.7 + n) * 0.5) * 6;
      c.style.cssText = `left:${col * cw - 3 + jitter(1)}vw; top:${row * rh - 4 + jitter(2)}vh; width:${cw + 7}vw; height:${rh + 10}vh;` +
        `--r:${(Math.sin(k * 3.1) * 7).toFixed(1)}deg; animation-delay:${(k * 0.12).toFixed(2)}s; z-index:${k}`;
      board.append(c);
      cards.push(c);
    }
    if (still) {
      const stills = H.mix().filter(it => it.kind !== "vid");
      cards.forEach((c, k) => stills[k] && c.append(H.el(stills[k], "", { small: true })));
    } else H.board(cards, H.photos, 4000, 2);
  }
  lay(!still);
  let wait;
  addEventListener("resize", () => { clearTimeout(wait); wait = setTimeout(() => lay(false), 250); });
</script>
</body>
</html>
