<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TRAVEL</title>
<link rel="stylesheet" href="/assets/hype.css?v=14">
<style>
  #stage { position: fixed; inset: 0; }
  .shade { position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: linear-gradient(90deg, #000c 0%, #0005 45%, transparent 70%), linear-gradient(transparent 50%, #000d); }
  .hud { position: fixed; z-index: 10; left: clamp(20px, 5vw, 70px); bottom: clamp(30px, 8vh, 84px); right: 20px; }
  .hud .title { transform-origin: left; }
  .hud .dest { margin: 6px 0 22px 8px; }
  .bar { width: min(560px, 100%); height: 10px; border: 2px solid #fff; padding: 2px; }
  .bar i { display: block; height: 100%; background: #fff; animation: load 20s linear infinite; }
  @keyframes load { from { width: 2%; } to { width: 100%; } }
  .stars { position: fixed; z-index: 10; top: 18px; right: 22px; font-size: 26px; letter-spacing: 3px; text-shadow: 2px 2px 0 #000; }
</style>
</head>
<body class="grain">
  <div id="stage"></div>
  <div class="shade"></div>
  <div class="stars">★★★★★</div>
  <div class="hud"><div class="title">TRAVEL</div><div class="dest">Bali · Koh Phangan · Feb 2027<br><span class="ctry">(Indonesia, Thailand)</span></div><div class="bar"><i></i></div></div>
<script src="/assets/hype.js?v=17"></script>
<script>
  const H = HYPE, stage = document.getElementById("stage");
  const layers = H.mix().map(it => H.el(it, "layer", { lazy: true }));
  layers.forEach(l => stage.append(l));
  H.cycle(layers, 2500);
  H.bed(); H.sound(); H.back(2);
</script>
</body>
</html>
