<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TRAVEL</title>
<link rel="stylesheet" href="/assets/hype.css?v=11">
<style>
  .wrap { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(280px, 38vw) 1fr; }
  .vid { position: relative; border-right: 8px solid #000; overflow: hidden; }
  .side { position: relative; display: grid; align-content: center; gap: 26px; padding: 34px clamp(22px, 4vw, 64px);
    background: radial-gradient(circle at 86% 14%, #fff6dc 0 46px, #fff6dc33 48px, transparent 150px), linear-gradient(160deg, #0b0820, #1d1350 70%, #3d1f6e); }
  .side .title { transform-origin: left; font-size: clamp(70px, 9vw, 150px); }
  .mosaic { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 760px; }
  .mosaic .m { position: relative; aspect-ratio: 4 / 5; overflow: hidden; border: 3px solid #000; outline: 2px solid #ffd23d; background: #111; }
  .mosaic .layer { transition: opacity .6s; }
  .mosaic .layer.on { animation: none; }
  @media (max-width: 760px) {
    html, body { overflow: auto; }
    .wrap { position: static; grid-template-columns: 1fr; }
    .vid { height: 72vh; border-right: 0; border-bottom: 8px solid #000; }
  }
</style>
</head>
<body class="grain">
  <div class="wrap">
    <div class="vid" id="vid"></div>
    <div class="side">
      <div><div class="title">TRAVEL</div><div class="dest">Bali · Koh Phangan · Feb 2027<br><span class="ctry">(Indonesia, Thailand)</span></div></div>
      <div class="mosaic" id="mosaic"></div>
    </div>
  </div>
<script src="/assets/hype.js?v=13"></script>
<script>
  const H = HYPE, main = H.clips[0];
  document.getElementById("vid").append(H.el(main, "", { sound: true }));
  const mosaic = document.getElementById("mosaic"), tiles = [];
  for (let k = 0; k < 9; k++) { const m = document.createElement("div"); m.className = "m"; mosaic.append(m); tiles.push(m); }
  H.board(tiles, H.photos.filter(p => p !== main), 4000);
  H.sound(); H.back(7);
</script>
</body>
</html>
