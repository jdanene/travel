<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TRAVEL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- No flash of plain text (owner, 25 Nov 2026): the page stays hidden until its stylesheet and both title
     fonts are in, at most 1.2 s, so a slow font never leaves it blank. -->
<style>html.wait { visibility: hidden; }</style>
<script>document.documentElement.className += " wait";</script>
<link rel="stylesheet" href="/assets/hype.css?v=14">
<style>
  .grid { position: fixed; inset: 0; padding: 8px; gap: 8px; display: grid;
    grid-template-columns: 1.1fr 1.6fr 1fr; grid-template-rows: 1fr 1fr 1fr;
    grid-template-areas: "a t c" "a d g" "e d w"; }
  .p { position: relative; overflow: hidden; border: 3px solid #000; background: #111; }
  .p .layer { transition: opacity .6s; }
  .p .layer.on { animation: none; }
  .center { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; text-align: center; padding: 12px; }
  .t .fill { filter: brightness(.55) saturate(1.3); }
  .t .title { font-size: clamp(60px, 9vw, 150px); }
  .t .dest { font-size: clamp(24px, 2.8vw, 44px); }
  .stars { position: absolute; z-index: 2; top: 10px; right: 12px; font-size: 22px; letter-spacing: 2px; text-shadow: 2px 2px 0 #000; }
  @media (max-width: 760px) {
    html, body { overflow: auto; }
    .grid { position: static; grid-template-columns: 1fr 1fr; grid-template-rows: 230px 340px 260px 260px 240px;
      grid-template-areas: "t t" "a g" "d d" "e c" "w w"; }
  }
</style>
</head>
<body class="grain">
  <main class="grid">
    <div class="p" id="a" style="grid-area:a"><span class="stars">★★★★★</span></div>
    <div class="p t" id="t" style="grid-area:t"><div class="center"><div><div class="title">TRAVEL</div><div class="dest">Bali · Koh Phangan · Feb 2027<br><span class="ctry">(Indonesia, Thailand)</span></div></div></div></div>
    <div class="p" id="c" style="grid-area:c"></div>
    <div class="p" id="d" style="grid-area:d"></div>
    <div class="p" id="g" style="grid-area:g"></div>
    <div class="p" id="e" style="grid-area:e"></div>
    <div class="p" id="w" style="grid-area:w"></div>
  </main>
<script src="/assets/hype.js?v=19"></script>
<script>
  const H = HYPE;
  // Every panel, the title panel too, cycles through every clip and photo; no two panels show the same one.
  H.board(["t", "a", "c", "d", "g", "e", "w"].map(id => document.getElementById(id)), H.photos, 4000);
  H.bed(); H.sound(); H.enter();
</script>
<script>
  // Runs after hype.css (a script waits for the stylesheets above it); then waits for the two title fonts.
  (function () {
    var root = document.documentElement, shown = false;
    var show = function () { if (!shown) { shown = true; root.classList.remove("wait"); } };
    setTimeout(show, 1200);
    if (!document.fonts || !document.fonts.load) return show();
    Promise.all([document.fonts.load("1em Anton"), document.fonts.load("1em Yellowtail")]).then(show, show);
  })();
</script>
</body>
</html>
