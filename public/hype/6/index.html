<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TRAVEL</title>
<link rel="stylesheet" href="/assets/hype.css?v=10">
<style>
  #stage { position: fixed; inset: 0; }
  .center.off { opacity: 0; }
  .vig { position: fixed; inset: 0; z-index: 4; pointer-events: none; background: radial-gradient(ellipse at center, transparent 25%, #000d 100%); }
  .center { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; text-align: center; pointer-events: none; }
  .state { grid-area: 1 / 1; opacity: 0; transform: scale(1.35); transition: opacity .25s, transform .35s cubic-bezier(.2, 1.4, .4, 1); }
  .state.on { opacity: 1; transform: scale(1); }
  .state .title { transform: none; }
</style>
</head>
<body class="grain">
  <div id="stage"></div>
  <div class="vig"></div>
  <div class="center">
    <div class="state"><div class="passed">PASSED</div></div>
    <div class="state"><div class="title">TRAVEL</div><div class="dest">Bali · Koh Phangan · Feb 2027</div></div>
  </div>
<script src="/assets/hype.js?v=10"></script>
<script>
  const H = HYPE, stage = document.getElementById("stage"), center = document.querySelector(".center");
  const items = H.mix(), layers = items.map(it => H.el(it, "layer", { lazy: true }));
  layers.forEach(l => stage.append(l));
  // The WASTED card carries its own words, so the big words step aside while it shows.
  H.cycle(layers, 2500, i => center.classList.toggle("off", !!items[i].wasted));
  H.cycle([...document.querySelectorAll(".state")], 3500);
  H.bed(); H.sound(); H.back(6);
</script>
</body>
</html>
