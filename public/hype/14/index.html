<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TRAVEL</title>
<link rel="stylesheet" href="/assets/hype.css?v=13">
<style>
  #stage { position: fixed; inset: -20px; }
  #stage .layer { transition: none; }
  .center.off { opacity: 0; }
  .vig { position: fixed; inset: 0; z-index: 4; pointer-events: none; background: radial-gradient(ellipse at center, transparent 30%, #000d 100%); }
  .center { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; text-align: center; pointer-events: none; }
  .state { grid-area: 1 / 1; opacity: 0; }
  .state.on { opacity: 1; animation: punch .45s cubic-bezier(.2, 1.5, .4, 1) both; }
  @keyframes punch { from { transform: scale(2.2); filter: blur(4px); } to { transform: scale(1); filter: none; } }
  .state .title { transform: none; }
  .shake { animation: shake .32s linear; }
  @keyframes shake { 0%, 100% { transform: none; } 20% { transform: translate(-10px, 6px); } 40% { transform: translate(8px, -8px); } 60% { transform: translate(-6px, -4px); } 80% { transform: translate(5px, 7px); } }
</style>
</head>
<body class="grain">
  <div id="stage"></div>
  <div class="vig"></div>
  <div class="center">
    <div class="state"><div class="passed">PASSED</div></div>
    <div class="state"><div class="title">TRAVEL</div><div class="dest">Bali · Koh Phangan · Feb 2027<br><span class="ctry">(Indonesia, Thailand)</span></div></div>
  </div>
<script src="/assets/hype.js?v=17"></script>
<script>
  const H = HYPE, stage = document.getElementById("stage"), center = document.querySelector(".center");
  const items = H.mix(), layers = items.map(it => H.el(it, "layer", { lazy: true }));
  layers.forEach(l => stage.append(l));
  // The WASTED card carries its own words, so the big words step aside while it shows.
  H.cycle(layers, 2500, i => center.classList.toggle("off", !!items[i].card));
  H.cycle([...document.querySelectorAll(".state")], 2600, () => {
    stage.classList.remove("shake"); void stage.offsetWidth; stage.classList.add("shake");
  });
  H.bed(); H.sound(); H.back(14);
</script>
</body>
</html>
